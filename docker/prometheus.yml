global:
  scrape_interval: 15s
  evaluation_interval: 15s

# celery_worker dan redis tidak mengekspos metrik Prometheus (tanpa exporter), jadi tidak di-scrape
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
